<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">Chin nod supino: testa appoggiata, piccolo cenno del mento</title>
<desc id="desc">Schema di controllo motorio senza resistenza esterna. Testa e busto appoggiati; un piccolo arco indica il cenno del mento, senza sollevare la testa. La configurazione va validata dal fisioterapista.</desc>
